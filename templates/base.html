{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}WMS · UPEC{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="{% static 'css/estilos.css' %}" rel="stylesheet">
</head>
<body class="app-page">

  <div class="app-shell">
    <aside class="app-sidebar">
      <a href="{% url 'dashboard' %}" class="brand-mark" title="WMS · UPEC">W</a>

      <div class="nav-stack">
        <a href="{% url 'dashboard' %}" class="nav-icon{% if request.resolver_match.url_name == 'dashboard' %} active{% endif %}" title="Tablero">🏠</a>
        <a href="{% url 'catalogo:listado' %}" class="nav-icon{% if request.resolver_match.app_name == 'catalogo' %} active{% endif %}" title="Catálogo">📦</a>
        <a href="{% url 'almacen:listado' %}" class="nav-icon{% if request.resolver_match.app_name == 'almacen' %} active{% endif %}" title="Almacén">🏬</a>
        <a href="{% url 'inventario:listado' %}" class="nav-icon{% if request.resolver_match.app_name == 'inventario' %} active{% endif %}" title="Inventario">📊</a>
        <a href="{% url 'recepcion:listado' %}" class="nav-icon{% if request.resolver_match.app_name == 'recepcion' %} active{% endif %}" title="Recepción">📥</a>
        <a href="{% url 'despacho:listado' %}" class="nav-icon{% if request.resolver_match.app_name == 'despacho' %} active{% endif %}" title="Despacho">📤</a>
      </div>

      <div class="nav-foot">
        <div class="avatar" title="{{ user.get_full_name|default:user.username }} · {{ user.get_rol_display }}">
          {{ user.username|upper|slice:":2" }}
        </div>
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button type="submit" class="logout-btn" title="Salir">⏻</button>
        </form>
      </div>
    </aside>

    <main class="app-main">
      {% if messages %}
        <div class="messages">
          {% for message in messages %}
            <div class="app-message {% if message.tags %}app-message-{{ message.tags }}{% endif %}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
  </div>

  <div class="door left" id="doorLeft"></div>
  <div class="door right" id="doorRight"></div>

<script src="{% static 'js/doors.js' %}"></script>
</body>
</html>
